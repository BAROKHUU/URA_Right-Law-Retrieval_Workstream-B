extends: h3_hybrid_rrf.yaml

hypothesis:
  id: H5
  description: "Fixed-length document-wise chunks vs hierarchical legal units under the same hybrid retriever."
  variables:
    - "representation.mode"
    - "ranking.deduplicate_by"

representation:
  mode: fixed_length
  fixed_length:
    source_unit_types: [article, clause, point]
    unit: words
    chunk_size: 220
    overlap: 40

indexing:
  output_dir: artifacts/indexes/h5_fixed_length_hybrid

ranking:
  # Fixed chunks are synthetic records; keep distinct chunks by default.
  deduplicate_by: record_id
