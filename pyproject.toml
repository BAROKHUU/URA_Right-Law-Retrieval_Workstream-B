[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-retrieval-experiments"
version = "0.1.0"
description = "Config-driven legal retrieval experimentation framework for enriched Vietnamese legal units."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dense = [
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8.0",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytest>=8.0",
]
all = [
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
